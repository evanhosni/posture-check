<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Posture Check</title>
  </head>
  <body class="card monitor">
    <h1 id="title">Calibrating posture</h1>
    <p id="status" class="status">Sit up straight.</p>

    <div id="capture">
      <div class="preview">
        <video id="preview" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
      </div>
      <div class="meter"><div id="bar" class="meter-fill"></div></div>
    </div>

    <button id="allow" class="primary hidden">Allow camera access</button>

    <div id="strip" class="strip hidden">
      <img class="strip-icon" src="icons/icon128.png" alt="" />
      <div class="strip-body">
        <div class="strip-actions">
          <button id="settings" class="glyph" title="Settings" aria-label="Settings">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 8h16M4 16h16" />
              <circle cx="10" cy="8" r="2.6" class="knob" />
              <circle cx="16" cy="16" r="2.6" class="knob" />
            </svg>
          </button>
          <button id="power" class="glyph power" title="Turn off" aria-label="Turn off">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3.5v8" />
              <path d="M7.4 6.9a7 7 0 1 0 9.2 0" />
            </svg>
          </button>
        </div>
        <p id="posture" class="strip-status">Watching your posture.</p>
      </div>
    </div>

    <script type="module" src="/monitor.ts"></script>
  </body>
</html>
